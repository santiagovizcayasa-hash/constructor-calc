<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Constructor Calc</title>
  <!-- Enlazamos la hoja de estilos que usan TODAS las páginas -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="barra-superior">Constructor Calc</header>

  <main class="contenedor">
    <div class="tarjeta">
      <h1>Iniciar sesión</h1>

      <form>
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" placeholder="Escribe tu usuario">
        </div>

        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="Escribe tu contraseña">
        </div>

        <a href="04-menu.html" class="boton">Ingresar</a>
      </form>

      <div class="enlaces-secundarios">
        <a href="03-recuperar.html">¿Olvidaste tu contraseña?</a>
        <a href="02-crear-cuenta.html">¿No tienes cuenta? Regístrate</a>
      </div>
    </div>
  </main>

</body>
</html>
