<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcular pintura - Constructor Calc</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="barra-superior">Constructor Calc</header>

  <main class="contenedor">
    <div class="tarjeta">
      <h1>Calcular pintura</h1>

      <form>
        <div class="campo">
          <label for="superficie">Superficie del muro (m&sup2;)</label>
          <input type="number" id="superficie" name="superficie" step="0.01" placeholder="Ej: 12">
        </div>

        <button type="button" class="boton">Calcular</button>
      </form>

      <div class="resultado">
        <h2>Resultado (ejemplo)</h2>
        <ul>
          <li>Pintura necesaria: 2 litros</li>
        </ul>
      </div>

      <a href="menu.html" class="volver">&larr; Volver al menú</a>
    </div>
  </main>

</body>
</html>
