<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcular muro - Constructor Calc</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="barra-superior">Constructor Calc</header>

  <main class="contenedor">
    <div class="tarjeta">
      <h1>Calcular muro</h1>

      <form>
        <div class="campo">
          <label for="espesor">Espesor</label>
          <select id="espesor" name="espesor">
            <option value="20">20 cm</option>
            <option value="30">30 cm</option>
          </select>
        </div>

        <div class="campo">
          <label for="largo">Largo (m)</label>
          <input type="number" id="largo" name="largo" step="0.01" placeholder="Ej: 5">
        </div>

        <div class="campo">
          <label for="alto">Alto (m)</label>
          <input type="number" id="alto" name="alto" step="0.01" placeholder="Ej: 2.4">
        </div>
        <button type="button" class="boton">Calcular</button>
      </form>
      <div class="resultado">
        <h2>Resultado (ejemplo)</h2>
        <ul>
          <li>Cemento: 45.6 kg</li>
          <li>Ladrillos: 360</li>
        </ul>
      </div>

      <a href="04-menu.html" class="volver">&larr; Volver al menú</a>
    </div>
  </main>

</body>
</html>
