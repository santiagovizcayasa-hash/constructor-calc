<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - Constructor Calc</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="barra-superior">Constructor Calc</header>

  <main class="contenedor">
    <div class="tarjeta">
      <h1>Olvide mi contraseña</h1>
      <p style="margin-bottom:16px; font-size:0.9rem;">
        Ingresa tu usuario o correo electronico vinculado con tu cuenta.
      </p>

      <form>
        <div class="campo">
          <label for="usuario">Usuario/correo</label>
          <input type="text" id="usuario" name="usuario" placeholder="Usuario o correo">
        </div>

        <a href="index.html" class="boton">Restablecer</a>
      </form>

      <a href="index.html" class="volver">&larr; Volver a inicio de sesion</a>
    </div>
  </main>

</body>
</html>
