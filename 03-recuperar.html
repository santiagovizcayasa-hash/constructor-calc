<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - Constructor Calc</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="barra-superior">Constructor Calc</header>

  <main class="contenedor">
    <div class="tarjeta">
      <h1>Olvidé mi contraseña</h1>
      <p class="texto-ayuda">
        Ingresa tu usuario o correo electrónico vinculado con tu cuenta.
      </p>

      <form>
        <div class="campo">
          <label for="usuario">Usuario/correo</label>
          <input type="text" id="usuario" name="usuario" placeholder="Usuario o correo">
        </div>

        <a href="01-login.html" class="boton">Restablecer</a>
      </form>

      <a href="01-login.html" class="volver">&larr; Volver al inicio de sesión</a>
    </div>
  </main>

</body>
</html>
