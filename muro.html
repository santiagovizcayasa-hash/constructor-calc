<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcular muro - Constructor Calc</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="barra-superior">Constructor Calc</header>

  <main class="contenedor">
    <div class="tarjeta">
      <h1>Calcular muro</h1>

      <form>
        <div class="campo">
          <label for="espesor">Espesor</label>
          <!-- El mockup dice "20 cm / 30cm", por eso uso un select
               con solo esas dos opciones en vez de un input libre -->
          <select id="espesor" name="espesor">
            <option value="20">20 cm</option>
            <option value="30">30 cm</option>
          </select>
        </div>

        <div class="campo">
          <label for="largo">Largo (m)</label>
          <input type="number" id="largo" name="largo" step="0.01" placeholder="Ej: 5">
        </div>

        <div class="campo">
          <label for="alto">Alto (m)</label>
          <input type="number" id="alto" name="alto" step="0.01" placeholder="Ej: 2.4">
        </div>

        <!-- 
          type="button" en vez de type="submit": no envia el formulario
          a ningun lado. Cuando le agreguen JavaScript, aqui van a
          escuchar el "click" de este boton para hacer el calculo real.
        -->
        <button type="button" class="boton">Calcular</button>
      </form>

      <!-- 
        Esta caja de resultado esta con los valores de EJEMPLO del
        mockup, fijos en el HTML. Cuando programen la logica en
        JavaScript, estos numeros los van a reemplazar dinamicamente.
      -->
      <div class="resultado">
        <h2>Resultado (ejemplo)</h2>
        <ul>
          <li>Cemento: 45.6 kg</li>
          <li>Ladrillos: 360</li>
        </ul>
      </div>

      <a href="menu.html" class="volver">&larr; Volver al menú</a>
    </div>
  </main>

</body>
</html>
