<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcular piso - Constructor Calc</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="barra-superior">Constructor Calc</header>

  <main class="contenedor">
    <div class="tarjeta">
      <h1>Calcular piso</h1>

      <form>
        <div class="campo">
          <label for="ancho">Ancho (m)</label>
          <input type="number" id="ancho" name="ancho" step="0.01" placeholder="Ej: 4">
        </div>

        <div class="campo">
          <label for="largo">Largo (m)</label>
          <input type="number" id="largo" name="largo" step="0.01" placeholder="Ej: 3">
        </div>

        <button type="button" class="boton">Calcular</button>
      </form>

      <div class="resultado">
        <h2>Resultado (ejemplo)</h2>
        <ul>
          <li>Superficie base: 12 m&sup2;</li>
          <li>Con 10% de recorte: 13.2 m&sup2;</li>
        </ul>
      </div>

      <a href="menu.html" class="volver">&larr; Volver al menú</a>
    </div>
  </main>

</body>
</html>
