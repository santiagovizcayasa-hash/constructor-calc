<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcular columna - Constructor Calc</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="barra-superior">Constructor Calc</header>

  <main class="contenedor">
    <div class="tarjeta">
      <h1>Calcular columna</h1>

      <form>
        <div class="campo">
          <label for="largo">Largo de la columna (m)</label>
          <input type="number" id="largo" name="largo" step="0.01" placeholder="Ej: 3">
        </div>

        <button type="button" class="boton">Calcular</button>
      </form>

      <div class="resultado">
        <h2>Resultado (ejemplo)</h2>
        <ul>
          <li>Cemento: 22.5 kg</li>
          <li>Arena: 0.048 m&sup3;</li>
          <li>Piedra: 0.048 m&sup3;</li>
          <li>Hierro &Oslash;10: 18 m</li>
          <li>Hierro &Oslash;4: 9 m</li>
        </ul>
      </div>

      <a href="04-menu.html" class="volver">&larr; Volver al menú</a>
    </div>
  </main>

</body>
</html>
